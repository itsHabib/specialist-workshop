name: Check workshop
on:
  push:
  pull_request:
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Synthetic investigation sandbox controls (no model calls)
        env:
          BRIDGE_DOCKER_TESTS: '1'
        run: |
          docker pull python@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
          python -m unittest discover -s experiments/investigation_bridge -p 'test_*.py' -v
      - run: node --check static/app.js
      - run: node --check static/practice.js
      - run: node --check static/analytics.js
      - run: node --check static/packages.js
      - run: git diff --exit-code
